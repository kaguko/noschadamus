name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: noschadamus
          POSTGRES_PASSWORD: noschadamus
          POSTGRES_DB: noschadamus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noschadamus"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://noschadamus:noschadamus@localhost:5432/noschadamus_test
      DATABASE_URL: postgresql://noschadamus:noschadamus@localhost:5432/noschadamus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:test:prepare
      - run: npm run test
      - run: npm run cards:validate -- --strict
      - run: npm run build
